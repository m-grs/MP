<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<meta name="theme-color" content="#0b0f14">
<title>Meal Prep</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<div id="app">
  <main id="main">

    <!-- TAB: ESSEN -->
    <section id="tab-essen" class="tab active">
      <h2>Essen</h2>
      <div class="card" id="suggest-card"></div>
      <div class="card" id="stock-card">
        <h3>Vorrat <span class="dim" id="stock-total"></span></h3>
        <div id="stock-list"></div>
      </div>
    </section>

    <!-- TAB: KOCHEN -->
    <section id="tab-kochen" class="tab">
      <h2>Kochen</h2>
      <div class="card">
        <h3>Gericht</h3>
        <input type="text" id="dish-input" class="text-input" placeholder="Name des Gerichts"
               autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <div id="dish-chips" class="chip-list"></div>
      </div>

      <div class="card">
        <h3>Portionen</h3>
        <div class="stepper stepper-lg">
          <button type="button" id="portions-minus" aria-label="Weniger">−</button>
          <span class="val" id="portions-value">4</span>
          <button type="button" id="portions-plus" aria-label="Mehr">+</button>
        </div>
      </div>

      <div class="card">
        <h3>Gekocht am</h3>
        <div class="date-switch" id="cook-date-switch">
          <button type="button" class="dbtn active" data-d="today">Heute</button>
          <button type="button" class="dbtn" data-d="yesterday">Gestern</button>
          <button type="button" class="dbtn" data-d="other">Anderes</button>
        </div>
        <input type="date" id="cook-date" class="date-input-visible" hidden>
      </div>

      <button type="button" id="btn-cook" class="btn primary">Eintragen</button>
    </section>

    <!-- TAB: KATALOG -->
    <section id="tab-katalog" class="tab">
      <h2>Katalog</h2>
      <div class="period-switch" id="sort-switch">
        <button type="button" data-s="last" class="active">Zuletzt</button>
        <button type="button" data-s="count">Häufigkeit</button>
        <button type="button" data-s="name">A–Z</button>
      </div>
      <p class="dim small" id="katalog-summary"></p>
      <div id="katalog-list"></div>
    </section>

    <!-- TAB: EINSTELLUNGEN -->
    <section id="tab-einstellungen" class="tab">
      <h2>Einstellungen</h2>

      <div class="card">
        <h3>Backup</h3>
        <button type="button" id="btn-export" class="btn">Backup exportieren</button>
        <label class="btn file-btn">
          Backup importieren
          <input type="file" id="import-file" accept="application/json,.json" class="hidden-file-input">
        </label>
      </div>

      <div class="card">
        <h3>CSV-Export</h3>
        <button type="button" id="btn-export-csv" class="btn">CSV exportieren</button>
      </div>

      <div class="card">
        <h3>Daten löschen</h3>
        <button type="button" id="btn-wipe" class="btn danger">Alle Daten unwiderruflich löschen</button>
      </div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button type="button" class="navbtn active" data-tab="essen">
      <svg viewBox="0 0 24 24"><path d="M3 12h18a9 8 0 0 1-18 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 3.5c-1 1.2 1 2.3 0 3.5M14.5 3.5c-1 1.2 1 2.3 0 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Essen</span>
    </button>
    <button type="button" class="navbtn" data-tab="kochen">
      <svg viewBox="0 0 24 24"><path d="M5 10h14v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M2.5 12H5M19 12h2.5M4 7h16M10 4.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Kochen</span>
    </button>
    <button type="button" class="navbtn" data-tab="katalog">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>
      <span>Katalog</span>
    </button>
    <button type="button" class="navbtn" data-tab="einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Einstellungen</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast" role="status">
  <span id="toast-text"></span>
  <button type="button" id="toast-undo" hidden>Rückgängig</button>
</div>

<!-- GERICHT IM VORRAT -->
<div id="dish-modal" class="modal-overlay" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <h3 id="dish-modal-title"></h3>
      <button type="button" id="dish-modal-close" class="modal-close" aria-label="Schließen">✕</button>
    </div>
    <p class="dim small">Noch da</p>
    <div id="dish-modal-batches"></div>
    <button type="button" id="dish-modal-eat" class="btn primary">1 Portion gegessen</button>
  </div>
</div>

<script src="app.js?v=1"></script>
</body>
</html>
